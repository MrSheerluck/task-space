server {
    listen 80;
    server_name taskspace.smbl.dev;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml image/png;

    # index.html is the entry point that references hashed assets. It must
    # never be cached, so a deploy's new hashed names are picked up immediately
    # (otherwise a stale copy points at old .js/.wasm files that 404 -> blank screen).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # hashed assets: cache forever
    location ~* \.(js|mjs|wasm|css|png|svg|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback (leptos router) — serves index.html for client routes, so
    # it must not be cached either.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
