server {
    listen 80;
    server_name taskspace.smbl.dev;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # Keep Wasm uncompressed. The frontend is fetched through the Cloudflare
    # Tunnel during manual auth/payment testing, and a compressed streamed Wasm
    # response can be truncated before the browser instantiates it. CSS/JS and
    # images are still compressed normally below.
    gzip_types text/css application/javascript application/json image/svg+xml image/png;

    # The browser app stays a static bundle, while auth, entitlement, sync,
    # and Dodo billing paths are handled by the Rust API container.
    location ~ ^/(auth|sync|account|billing|healthz|readyz)(/|$) {
        proxy_pass http://task-space-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE must flush each event immediately. Nginx's default proxy buffering
    # keeps the connection open but can hold small `space-update` frames until
    # a buffer fills, making other tabs and browsers look permanently stale.
    location = /sync/events {
        proxy_pass http://task-space-api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep small SSE frames streaming through the tunnel instead of being
        # transformed or accumulated by an intermediary.
        add_header Cache-Control "no-cache, no-transform";
        add_header X-Accel-Buffering "no";
    }

    location = /webhooks/dodo {
        proxy_pass http://task-space-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html is the entry point that references hashed assets. It must
    # never be cached, so a deploy's new hashed names are picked up immediately
    # (otherwise a stale copy points at old .js/.wasm files that 404 -> blank screen).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # wasm-bindgen's generated snippet directory is not reliably
    # content-addressed across rebuilds. Revalidate it so a new index.html
    # cannot be paired with an older immutable snippet and fail SRI.
    location ^~ /snippets/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Truly hashed assets: cache forever.
    location ~* \.wasm$ {
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|mjs|wasm|css|png|svg|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback (leptos router) — serves index.html for client routes, so
    # it must not be cached either.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
