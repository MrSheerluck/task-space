services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskspace
      POSTGRES_USER: taskspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskspace -d taskspace"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  task-space:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - task-space-api

  task-space-api:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://taskspace:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/taskspace
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback binding supports local Trunk development on :8080 without
    # exposing the authenticated API to the public network.
    ports:
      - "127.0.0.1:3000:3000"

  # journal: second SMBL product
  # (in its own compose once its source + domain + secrets are confirmed;
  #  caddy routes journal.<domain> -> journal:80 when enabled)
  journal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c", "echo 'journal placeholder - source pending'; sleep infinity"]

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
