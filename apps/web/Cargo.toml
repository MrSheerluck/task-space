[package]
name = "task-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
task-core = { path = "../../crates/core" }
leptos = { version = "0.8.20", features = ["csr"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", features = ["http", "json"] }
leptos_router = "0.8.15"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventSource",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "MessageEvent",
    "ProgressEvent",
    "Storage",
    "Url",
    "Window",
] }
